[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beatbook"
version = "1.0.0"
description = "Track who covers your beat: outlets, themes, framing tendency and relationship gaps, from bylines alone."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sadok Ayari"}]
keywords = ["media relations", "journalists", "byline", "press", "monitoring", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications",
]

[project.urls]
Homepage = "https://github.com/sadok-ayari/beatbook"

[project.scripts]
beatbook = "beatbook.cli:main"

[tool.setuptools]
packages = ["beatbook"]
